name: Android build and parser checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Run synthetic host JVM regressions
        run: bash tests/run-parser-checks.sh

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install project SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug
